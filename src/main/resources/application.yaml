spring:
  application:
    name: codemod-eval
  threads:
    virtual:
      enabled: true
  datasource:
    # ponytail: H2 in PostgreSQL mode so the later switch to Postgres is mostly a URL change
    url: jdbc:h2:file:./data/codemod-eval;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE  # JobRunr shuts down after H2's own hook
    username: sa
    password: ""
    hikari:
      # H2 binds IN(...) check constraints to the session that created them (Flyway's connection). Retiring that
      # connection (Hikari's default 30 min max-lifetime) makes every write to those tables fail with
      # "Check constraint invalid ... database has been closed". Keep connections for good; drop this with Postgres.
      max-lifetime: 0
  flyway:
    locations: classpath:db/migration
    fail-on-missing-locations: true   # missing/misplaced migration dir fails startup
    validate-migration-naming: true   # misnamed file (e.g. V1_create.sql) fails instead of being skipped
  mvc:
    problemdetails:
      enabled: true                   # errors (400 validation, 409 conflict) as application/problem+json
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate              # flyway owns the schema; hibernate only checks entities match it
  ai:
    model:
      chat: openai                    # only the chat model; no embedding/image/audio/moderation beans
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      base-url: https://openrouter.ai/api/v1   # OpenRouter speaks the OpenAI api
      api-key: ${OPENROUTER_API_KEY}
      chat:
        options:
          model: ${OPENROUTER_MODEL:anthropic/claude-haiku-5.5}   # tool use + JSON output; $0.10/$0.50 per M tokens

codemod-eval:
  repo-reach: ${REPO_REACH:5}     # how many dependent repos each codemod is validated against

management:
  endpoints:
    web:
      base-path: /                    # health at /health

jobrunr:
  background-job-server:
    enabled: true
    worker-count: 4               # max validation jobs running at once (each will run docker builds)
    thread-type: VirtualThreads
    poll-interval-in-seconds: 5
  dashboard:
    enabled: true                 # http://localhost:8000 (no auth yet; set username/password before exposing it)
    port: 8000
  jobs:
    default-number-of-retries: 3  # exponential backoff between attempts
