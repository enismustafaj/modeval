<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>codemod-eval</title>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.4/dist/sse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx-ext-json-enc@2.0.3/dist/json-enc.min.js"></script>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
  <header>
    <div>
      <h1>codemod-eval</h1>
      <p>Validate a codemod against real repos that depend on its target package.</p>
    </div>
    <span class="live" id="live">connecting</span>
  </header>

  <div class="layout">
    <section class="card">
      <h2>New validation</h2>
      <form hx-post="/codemods" hx-ext="json-enc" hx-swap="none"
            hx-on::after-request="const out = this.querySelector('output'); const ok = event.detail.successful;
              out.className = ok ? 'ok' : 'error';
              out.textContent = ok ? 'Queued. Follow it in the activity log.' : 'Error ' + event.detail.xhr.status + ': ' + event.detail.xhr.responseText">
        <fieldset>
          <legend>Codemod</legend>
          <label>Name <input name="name" required placeholder="react-19-replace-reactdom-render"></label>
          <div class="row">
            <label>Version <input name="version" required placeholder="0.1.4"></label>
            <label>Source
              <select name="source"><option th:each="s : ${sources}" th:value="${s}" th:text="${s}"></option></select>
            </label>
          </div>
        </fieldset>
        <fieldset>
          <legend>Target package</legend>
          <div class="row">
            <label>Ecosystem
              <select name="targetEcosystem"><option th:each="e : ${ecosystems}" th:value="${e}" th:text="${e}"></option></select>
            </label>
            <label>Versions <input name="targetVersionRange" required placeholder="&lt;19"></label>
          </div>
          <label>Package <input name="targetPackage" required placeholder="react"></label>
        </fieldset>
        <button>Validate</button>
        <output></output>
      </form>
    </section>

    <section class="card">
      <h2>Activity</h2>
      <ul id="log" hx-ext="sse" sse-connect="/events" sse-swap="activity" hx-swap="afterbegin"></ul>
    </section>
  </div>
</main>
<script>
  // connection indicator: the sse extension fires these on the element that holds sse-connect
  const live = document.getElementById("live");
  const log = document.getElementById("log");
  log.addEventListener("htmx:sseOpen", () => { live.dataset.state = "open"; live.textContent = "live"; });
  log.addEventListener("htmx:sseError", () => { live.dataset.state = "error"; live.textContent = "reconnecting"; });
</script>
</body>
</html>
